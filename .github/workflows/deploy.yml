name: Deploy to Local Production

on:
  push:
    branches: [ deploy ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: deploy

      - name: Sync to Local Project Folder
        shell: cmd
        run: |
          robocopy . "C:\Users\Cotrini\Documents\Unal\Projects\Colombiasincomision" /E /XD .git node_modules vendor /XF .env
          IF %ERRORLEVEL% LEQ 7 EXIT 0 ELSE EXIT %ERRORLEVEL%

      - name: Clear Cache & Optimize
        working-directory: C:\Users\Cotrini\Documents\Unal\Projects\Colombiasincomision\backend
        run: |
          php artisan config:clear
          php artisan view:clear