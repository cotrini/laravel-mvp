name: Deploy Laravel to Hostinger VPS

on:
  push:
    branches: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Hostinger VPS via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Nos movemos a la carpeta principal del sitio web
          cd /home/colombiasincomision/htdocs/www.colombiasincomision.com
          
          # Si la carpeta backend no existe como un repositorio git válido, limpiamos y clonamos correctamente
          if [ ! -d "backend/.git" ]; then
            rm -rf backend
            mkdir -p backend
            git clone git@github.com:cotrini/laravel-mvp.git backend
          else
            cd backend
            git pull origin deploy
          fi
          
          # Nos movemos a la ruta exacta donde ahora sí está el composer.json de Laravel
          cd /home/colombiasincomision/htdocs/www.colombiasincomision.com/backend
          
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache