name: Deploy Laravel to Hostinger VPS

on:
  push:
    branches: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Hostinger VPS via SSH
      uses: appleboy/ssh-action@master
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        envs: GH_PAT
        script: |
          set -e

          SITE_DIR=/home/colombiasincomision/htdocs/www.colombiasincomision.com
          cd $SITE_DIR

          # Primera vez: convertir la carpeta del sitio en repositorio git
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://github.com/cotrini/laravel-mvp.git
          fi

          # Traer lo último de la rama deploy
          git fetch https://${GH_PAT}@github.com/cotrini/laravel-mvp.git deploy
          git reset --hard FETCH_HEAD

          # El proyecto Laravel queda en SITE_DIR/backend (sin carpeta doble)
          cd $SITE_DIR/backend

          # Primera vez: crear .env si no existe
          if [ ! -f .env ]; then
            cp .env.example .env
            php artisan key:generate --force
            echo "AVISO: se creó .env desde .env.example. Configura DB y APP_URL en el VPS."
          fi

          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache