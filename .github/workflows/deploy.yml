name: Deploy Laravel to Hostinger VPS

on:
  push:
    branches: [ deploy ] # Se activará cada vez que hagas push a la rama 'deploy'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Hostinger VPS via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/colombiasincomision/htdocs/www.colombiasincomision.com
          if [ ! -d "backend/.git" ]; then
            rm -rf backend
            git clone git@github.com:TU_USUARIO/TU_REPOSITORIO.git backend
          fi
          cd backend
          git pull origin deploy
          composer install --no-dev --optimize-autoloader --no-interaction
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache